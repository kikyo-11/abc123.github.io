<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>剧本｜itty‑sockets联机版</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        body {
            background:#171721;
            color:#e6e6f2;
            padding:24px;
            font-family:system-ui, sans-serif;
            max-width:1100px;
            margin:0 auto;
            line-height:1.7;
        }
        .container{
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap:24px;
        }
        @media(max-width:768px){
            .container{grid-template-columns:1fr;}
        }
        .story-box{
            background:#1f1f30;
            padding:20px;
            border-radius:10px;
            border:1px solid #383855;
        }
        .story-content{
            min-height:220px;
            margin:16px 0;
            white-space:pre-wrap;
        }
        .panel-box{
            background:#1f1f30;
            padding:20px;
            border-radius:10px;
            border:1px solid #383855;
        }
        .toolbar{
            margin-bottom:16px;
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            align-items:center;
        }
        select,button,input{
            padding:7px 12px;
            font-size:14px;
            border:none;
            border-radius:4px;
        }
        button{cursor:pointer;}
        .host-panel{
            background:#222233;
            padding:14px;
            border-radius:6px;
            margin-bottom:20px;
        }
        .host-item{
            padding:10px 0;
            border-bottom:1px solid #333348;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:8px;
        }
        .host-clue-title{
            color:#ddddff;
            font-weight:500;
        }
        .host-mask-text{
            color:#777;
            font-style:italic;
        }
        .clue-item,.memory-item{
            background:#212132;
            padding:12px 14px;
            border-radius:6px;
            margin:8px 0;
        }
        .memory-item{
            background:#272038;
            border-left:3px solid #9468c2;
        }
        .tag{
            font-size:12px;
            padding:2px 6px;
            border-radius:3px;
            margin-right:6px;
        }
        .tag-clue{background:#284270;}
        .tag-memory{background:#542f74;}
        .tag-unlock{background:#246338;}
        .tag-lock{background:#603030;}
        .status-bar{margin:8px 0;color:#ccc;}
    </style>
</head>
<body>
<div class="toolbar">
    <span>房间ID:</span>
    <input id="roomIdInput" value="my‑script‑room‑001">
    <button onclick="connectRoom()">连接房间</button>
    <span>身份：</span>
    <select id="roleSelect">
        <option value="host">👑房主主持人</option>
        <option value="p1">👤玩家P1</option>
        <option value="p2">👤玩家P2</option>
        <option value="p3">👤玩家P3</option>
    </select>
    <span>环节：<b id="stageText">1</b></span>
    <button onclick="nextStage()">下一环节(仅房主)</button>
</div>
<div class="status-bar" id="connStatus">未连接房间</div>

<div class="container">
    <div class="story-box">
        <h3>📖 当前剧本剧情</h3>
        <div class="story-content" id="storyText"></div>
    </div>

    <div class="panel-box">
        <div id="hostView" class="host-panel" style="display:none;">
            <h4>房主管理面板（仅看线索标题，看不到正文）</h4>
            <div id="hostList"></div>
        </div>

        <h3>📜我的线索</h3>
        <div id="myClues"></div>
        <h3>🗝️我的记忆碎片</h3>
        <div id="myMemory"></div>
    </div>
</div>

<script>
// itty‑sockets 直接内嵌客户端，不用import，单html可用
let connect=(e,s={})=>{let t,n=[],o=[],a=0,r=()=>{t||(t=new WebSocket(`wss://ittysockets.io/r/${e??""}?${new URLSearchParams(s)}`),t.onopen=()=>{for(;n.length;)t?.send(n.shift());a&&t?.close()},t.onmessage=(e,s=JSON.parse(e.data))=>{for(let e of o)e({...s,date:new Date(s.date)})},t.onclose=()=>(a=0,t=null))};return new Proxy(r,{get:(e,s,l)=>({ws:t,send:(e,s)=>{t? t.send(JSON.stringify({type:s??"message",payload:e})):n.push([e,s]);return l},on:(e,s)=>{o.push(({type:l,...p})=>l===e&&s(p));return l},close:()=>a=1}))}

// =========剧本配置（初始模板）=========
const storyStages = [
    {stage:1,text:`【第一幕：雨夜案发】
暴雨夜晚，别墅内传来一声惨叫。
众人赶到房间，发现出事了。
大家开始互相问话。`},
    {stage:2,text:`【第二幕：线索浮现】
现场开始搜查物证。部分角色获得专属线索。`},
    {stage:3,text:`【第三幕：回忆涌现】
过往记忆开始浮现，真相慢慢靠近。`}
]
const baseClueData = [
    {id:1,title:"撕碎的便签",type:"clue",content:"今晚零点老地方见面，不要告诉任何人，纸条边缘沾有雨水。",targetRole:["p1"],isUnlocked:false,triggerStage:2},
    {id:2,title:"雨夜记忆片段",type:"memory",content:"大雨，黑色雨伞，那个人的脸完全模糊，只记得低沉的说话声。",targetRole:["p2"],isUnlocked:false,triggerStage:0},
    {id:3,title:"陌生通话记录",type:"clue",content:"23点12分，一通47秒陌生来电，号码无登记信息。",targetRole:["p1","p3"],isUnlocked:false,triggerStage:3}
]

// 全局运行状态
let socket = null;
let currentRole = "host";
// 房间权威状态，只有房主修改后广播，所有人同步
let roomState = {
    currentStage:1,
    clueData:JSON.parse(JSON.stringify(baseClueData))
};

// 连接房间
function connectRoom(){
    const rid = document.getElementById("roomIdInput").value.trim();
    if(!rid)return;
    socket = connect(rid,{echo:true});
    document.getElementById("connStatus").innerText = "正在连接…";

    socket.on("open",()=>{
        document.getElementById("connStatus").innerText = "✅房间已连接";
        renderAll();
    })
    socket.on("close",()=>{
        document.getElementById("connStatus").innerText = "❌房间断开";
    })
    // 监听房主广播的全局状态
    socket.on("state‑broadcast",(evt)=>{
        roomState = evt.payload;
        renderAll();
    })
}

// 房主广播完整房间状态给所有人
function broadcastState(){
    if(!socket || currentRole !== "host") return;
    socket.send(roomState,"state‑broadcast");
}

// 房主：下一剧情环节
function nextStage(){
    if(currentRole !== "host") return;
    roomState.currentStage +=1;
    // 环节自动解锁
    roomState.clueData.forEach(c=>{
        if(c.triggerStage>0 && c.triggerStage === roomState.currentStage){
            c.isUnlocked = true;
        }
    })
    broadcastState();
}

// 房主：手动开放单条线索
function hostUnlockClue(clueId){
    if(currentRole !== "host") return;
    const item = roomState.clueData.find(x=>x.id === clueId);
    if(item){
        item.isUnlocked = true;
        broadcastState();
    }
}

// 渲染页面（每个人根据自己角色，过滤展示内容）
function renderAll(){
    currentRole = document.getElementById("roleSelect").value;
    document.getElementById("stageText").innerText = roomState.currentStage;

    const stageItem = storyStages.find(s=>s.stage === roomState.currentStage);
    document.getElementById("storyText").innerText = stageItem ? stageItem.text : "剧情结束";

    const hostViewDom = document.getElementById("hostView");
    const hostListDom = document.getElementById("hostList");
    const myCluesDom = document.getElementById("myClues");
    const myMemoryDom = document.getElementById("myMemory");
    myCluesDom.innerHTML="";myMemoryDom.innerHTML="";hostListDom.innerHTML="";

    if(currentRole === "host"){
        hostViewDom.style.display = "block";
        roomState.clueData.forEach(c=>{
            const div = document.createElement("div");
            div.className = "host-item";
            const statusTag = c.isUnlocked
                ? `<span class="tag tag-unlock">已开放</span>`
                : `<span class="tag tag-lock">未开放</span>`;
            div.innerHTML = `
                <div>
                    <span class="host-clue-title">${c.title}</span>
                    ${statusTag}
                    <span class="tag ${c.type==='clue'?'tag-clue':'tag-memory'}">${c.type==='clue'?'线索':'记忆'}</span>
                    <span>分配：${c.targetRole.join(",")}</span>
                    <span class="host-mask-text">【内容对房主隐藏】</span>
                    ${c.triggerStage>0 ? `<span>自动环节:${c.triggerStage}</span>`:""}
                </div>
                <div>
                    ${!c.isUnlocked ? `<button onclick="hostUnlockClue(${c.id})">开放线索</button>`:""}
                </div>
            `;
            hostListDom.appendChild(div);
        })
    }else{
        hostViewDom.style.display = "none";
        roomState.clueData.forEach(c=>{
            if(c.targetRole.includes(currentRole) && c.isUnlocked){
                if(c.type==="clue"){
                    let d=document.createElement("div");
                    d.className="clue-item";
                    d.innerHTML=`<b>${c.title}</b><br>${c.content}`;
                    myCluesDom.appendChild(d);
                }else{
                    let d=document.createElement("div");
                    d.className="memory-item";
                    d.innerHTML=`<b>${c.title}</b><br>${c.content}`;
                    myMemoryDom.appendChild(d);
                }
            }
        })
    }
}

document.getElementById("roleSelect").addEventListener("change",renderAll);
renderAll();
</script>
</body>
</html>
